name: Downloadable package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build downloadable source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' ./ package/

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: mon-actualite-v98-98.10-source
          path: package/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable install key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mon-actualite-debug-keystore&per_page=1" --jq '.artifacts[0].id // empty')"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/signing-key.zip
          unzip -o /tmp/signing-key.zip -d "$HOME/.android"
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android APK
        working-directory: android-app
        env:
          MON_ACTUALITE_KEYSTORE: /home/runner/.android/debug.keystore
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk mon-actualite-v98-98.10.apk
          test -s mon-actualite-v98-98.10.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-actualite-v98-98.10-apk
          path: mon-actualite-v98-98.10.apk
          if-no-files-found: error
          retention-days: 30
