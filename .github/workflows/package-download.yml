name: Downloadable package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build downloadable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' ./ package/
      - name: Upload v84 package
        uses: actions/upload-artifact@v4
        with:
          name: mon-actualite-v84-91.95
          path: package/
          if-no-files-found: error
          retention-days: 7
