name: Regression checks

on:
  push:
  pull_request:

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Static regression suites
        run: |
          node tests/v89-static-check.mjs
          node tests/v91-lead-choice.mjs
          node tests/v91-ai-request-control.mjs
          node tests/v914-release-watch.mjs
          node tests/v9112-summary-gate.mjs
          node tests/v9113-category-classifier.mjs
          node tests/v9114-news-dedup.mjs
          node tests/v9115-home-significance.mjs
          node tests/v9119-visual-prepared-state.mjs
          node tests/v9120-mobile-work-budget.mjs
          node tests/v9122-personalization-learning.mjs
          node tests/v9123-home-source-mentions.mjs
          node tests/v9124-true-novelty.mjs
          node tests/v9125-diagnostic-metrics.mjs
          node tests/v9126-manual-refresh-bridge.mjs
          node tests/v9127-home-seen-fallback.mjs
          node tests/v9128-pending-payload-apply.mjs
          node tests/v9129-summary-race-diagnostics.mjs
          node tests/v9130-context-signals.mjs
          node tests/v9131-category-context.mjs
          node tests/v9132-category-gaps.mjs

  mobile-browser:
    needs: static-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Android and PWA browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mon-actualite-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.2
          done
          node tests/v89-mobile-browser.mjs
          node tests/v916-settings-browser.mjs
          node tests/v918-visual-stability.mjs
          node tests/v919-summary-quality.mjs
          node tests/v9110-brief-dedup.mjs
          node tests/v9111-navigation-performance.mjs
          node tests/v9112-brief-real-feed.mjs
