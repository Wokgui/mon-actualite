name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk mon-actualite-v94.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-actualite-v94-apk
          path: mon-actualite-v94.apk
          if-no-files-found: error
          retention-days: 30
