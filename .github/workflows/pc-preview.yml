name: Publish PC preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview news snapshot
        run: |
          if curl -fsSL --retry 3 --retry-delay 2 "https://mon-actualite.vercel.app/api/news?language=fr&locale=fr-FR&country=FR&preview=1&t=$(date +%s)" -o /tmp/preview-news.json; then
            node <<'NODE'
          const fs = require('fs');
          const path = '/tmp/preview-news.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          const absoluteApi = value => typeof value === 'string' && value.startsWith('/api/')
            ? 'https://mon-actualite.vercel.app' + value
            : value;
          for (const article of Array.isArray(payload.articles) ? payload.articles : []) {
            article.image = absoluteApi(article.image || '');
            if (article.visual && typeof article.visual === 'object') {
              article.visual.url = absoluteApi(article.visual.url || '');
            }
          }
          fs.writeFileSync('preview-news.json', JSON.stringify(payload));
          NODE
          else
            printf '{"fetchedAt":"%s","articles":[],"errors":["preview snapshot unavailable"]}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > preview-news.json
          fi
      - name: Publish preview branch
        run: |
          rm -rf /tmp/preview
          mkdir -p /tmp/preview
          cp -a . /tmp/preview/
          cd /tmp/preview
          rm -rf .git android-app
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "PC preview"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
