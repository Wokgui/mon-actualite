name: Android APK release

on:
  push:
    branches:
      - main
      - codex/preferences-site-original-98-68
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore the existing Android signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.MON_ACTUALITE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64" || { echo '::error::Secret de signature MON_ACTUALITE_RELEASE_KEYSTORE_B64 indisponible.'; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/mon-actualite.keystore"

      - name: Build APK
        working-directory: android-app
        env:
          MON_ACTUALITE_KEYSTORE: ${{ runner.temp }}/mon-actualite.keystore
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Mon-Actualite-98.69.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-actualite-v98-69-apk
          path: Mon-Actualite-98.69.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v98.69"
          APK="Mon-Actualite-98.69.apk"
          NOTES="Choix Plus comme ça, Moins comme ça, Suivre et Masquer la source pendant la lecture sur le site original."
          gh release download 'android-v98.68' --pattern 'Mon-Actualite-98.68.apk' --output "$RUNNER_TEMP/previous-release.apk"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          signer_digest() {
            "$APKSIGNER" verify --print-certs "$1" | sed -nE 's/^(Signer|V[0-9.]+ Signer)[^:]*:?[[:space:]]+certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]{64})[[:space:]]*$/\2/p' | tr '[:upper:]' '[:lower:]' | sort -u
          }
          OLD_SIGNER="$(signer_digest "$RUNNER_TEMP/previous-release.apk")"
          NEW_SIGNER="$(signer_digest "$APK")"
          test -n "$OLD_SIGNER"
          if [ "$OLD_SIGNER" != "$NEW_SIGNER" ]; then
            echo "::error::La signature diffère de celle de l’APK déjà publié."
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Mon Actualité 98.69 — préférences sur le site original" --notes "$NOTES" --latest
