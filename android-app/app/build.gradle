plugins {
    id 'com.android.application'
}

def stableDebugKeystore = System.getenv('MON_ACTUALITE_KEYSTORE')

android {
    namespace 'com.wokgui.monactualite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.monactualite'
        minSdk 26
        targetSdk 35
        versionCode 113
        versionName '98.0.35'
    }

    signingConfigs {
        stableDebug {
            if (stableDebugKeystore) {
                storeFile file(stableDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            if (stableDebugKeystore) signingConfig signingConfigs.stableDebug
        }
    }
}

def generatedWebAssets = layout.buildDirectory.dir("generated/web-assets")

tasks.register("prepareWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "*.html"
        include "*.css"
        include "*.js"
        include "*.webmanifest"
        include "assets/**"
        include "services/**"
    }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)
tasks.named("preBuild").configure { dependsOn("prepareWebAssets") }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
