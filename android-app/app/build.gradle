plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wokgui.monactualite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.monactualite'
        minSdk 26
        targetSdk 35
        versionCode 93
        versionName '93.92.03'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }
}

def generatedWebAssets = layout.buildDirectory.dir("generated/web-assets")

tasks.register("prepareWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "*.html"
        include "*.css"
        include "*.js"
        include "*.webmanifest"
        include "assets/**"
        include "services/**"
    }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)
tasks.named("preBuild").configure { dependsOn("prepareWebAssets") }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
